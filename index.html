<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عصام عبد المنان  | نبذة شخصية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(15, 23, 42, 0.8);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --secondary: #818cf8;
      --accent: #c084fc;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(129, 140, 248, 0.15) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .bio-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 32px;
      width: 100%;
      max-width: 480px;
      padding: 3rem 2rem 2.5rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.12);
    }

    .avatar-wrap {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 1.5rem;
    }

    .avatar-glow {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
      animation: spin 8s linear infinite;
      filter: blur(6px);
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .avatar-img {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 3px solid rgba(255, 255, 255, 0.2);
      background: #0f172a;
    }

    .status-dot {
      position: absolute;
      bottom: 6px;
      left: 8px;
      background: #10b981;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 3.5px solid #0f172a;
      box-shadow: 0 0 10px #10b981;
      z-index: 2;
    }

    .name {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .handle {
      display: inline-block;
      direction: ltr;
      color: var(--primary);
      font-size: 0.95rem;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 0.35rem 0.9rem;
      border-radius: 50px;
      margin-bottom: 1.5rem;
    }

    .bio-text {
      color: var(--text-muted);
      font-size: 1.1rem;
      line-height: 1.8;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      padding: 1.4rem;
      border-radius: 20px;
      text-align: right;
    }
  </style>
</head>
